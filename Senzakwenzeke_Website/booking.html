<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senzakwenzeke - Book Your Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="margin:0; font-family:Arial, sans-serif; background:white;">

<div class="container mt-5">
    <h1 style="color: #d4af37; text-align:center; font-weight:bold;">Book Your Event</h1>
    <p style="text-align:center; color: #666;">Fill the form below - Bothas Hill, Durban</p>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div style="background-color: #000; padding: 30px; border-radius: 15px; border: 2px solid #d4af37;">

                <form action="#" method="post">
                    <label style="color: #d4af37;">Full Name</label>
                    <input type="text" class="form-control mb-3" placeholder="Enter your full name" required />

                    <label style="color: #d4af37;">Email</label>
                    <input type="email" class="form-control mb-3" placeholder="your@email.com" required />

                    <label style="color: #d4af37;">Phone Number</label>
                    <input type="tel" class="form-control mb-3" placeholder="081 234 5678" required />

                    <label style="color: #d4af37;">Event Date</label>
                    <input type="date" class="form-control mb-3" required />

                    <label style="color: #d4af37;">Service Type</label>
                    <select class="form-control mb-3" required>
                        <option>Select Service</option>
                        <option>Decor Only</option>
                        <option>Catering Only</option>
                        <option>Decor + Catering</option>
                        <option>Full Event Planning</option>
                    </select>

                    <label style="color: #d4af37;">Number of Guests</label>
                    <input type="number" class="form-control mb-3" placeholder="e.g. 50" />

                    <label style="color: #d4af37;">Message</label>
                    <textarea class="form-control mb-4" rows="3" placeholder="Tell us about your event..."></textarea>

                    <div style="text-align:center;">
                        <button type="submit" style="background-color: #d4af37; color: black; border: none; padding: 12px 40px; border-radius: 25px; font-weight: bold; font-size: 16px; width: 100%;">Submit Booking</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <br><br>
</div>

</body>
</html>
