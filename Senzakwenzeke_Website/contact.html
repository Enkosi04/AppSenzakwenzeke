<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senzakwenzeke - Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="margin:0; font-family:Arial, sans-serif; background:white;">

<div class="container mt-5">
    <h1 style="color: #d4af37; text-align:center; font-weight:bold; margin-bottom:10px;">Contact Us</h1>
    <p style="text-align:center; color:#666; margin-bottom:30px;">Bothas Hill, Durban - We bring your event to life</p>

    <div class="row">
        <!-- LEFT - CONTACT INFO -->
        <div class="col-md-6 mb-4">
            <div style="background-color: #000; color: white; padding: 30px; border-radius: 15px; border: 2px solid #d4af37; height: 100%;">
                <h3 style="color: #d4af37;">Get In Touch</h3>
                <hr style="border-color: #d4af37;" />

                <p style="margin-top:20px;"><strong style="color:#d4af37;">Location:</strong><br />Bothas Hill<br />Durban, KZN 3610</p>

                <p><strong style="color:#d4af37;">Phone:</strong><br />081 234 5678</p>

                <p><strong style="color:#d4af37;">Email:</strong><br />info@senzakwenzeke.co.za</p>

                <p><strong style="color:#d4af37;">Hours:</strong><br />Mon - Sat: 8am - 6pm<br />Sunday: By Appointment</p>

                <div style="margin-top:25px;">
                    <a href="https://wa.me/27812345678" style="background-color: #25D366; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; display: inline-block;">WhatsApp Us</a>
                </div>
            </div>
        </div>

        <!-- RIGHT - CONTACT FORM -->
        <div class="col-md-6 mb-4">
            <div style="background-color: #000; padding: 30px; border-radius: 15px; border: 2px solid #d4af37; height: 100%;">
                <h3 style="color: #d4af37;">Send Message</h3>
                <hr style="border-color: #d4af37;" />

                <form action="#" method="post" style="margin-top:20px;">
                    <input type="text" class="form-control mb-3" placeholder="Your Name" required />
                    <input type="email" class="form-control mb-3" placeholder="Your Email" required />
                    <input type="text" class="form-control mb-3" placeholder="Subject" />
                    <textarea class="form-control mb-3" rows="4" placeholder="Your Message..." required></textarea>
                    <button type="submit" style="background-color: #d4af37; color: black; border: none; padding: 12px; border-radius: 25px; font-weight: bold; width: 100%;">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
<br><br>
</body>
</html>
